[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "metainsight"
description = "Python implementation scaffolding for MetaInsight"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
version = "0.1.0"
authors = [{ name = "MetaInsight contributors", email = "" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.8",
  "scipy>=1.14",
  "plotly>=5.24",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115",
  "uvicorn>=0.31",
]

gui = [
  "streamlit>=1.39",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.12",
  "python-dotenv>=1.0",
  "pre-commit>=4.0",
]

[project.scripts]
metainsight = "metainsight.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/metainsight"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
minversion = "7.0"
addopts = ["--strict-markers", "--strict-config", "-ra"]
testpaths = ["tests/python"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_unused_ignores = true
